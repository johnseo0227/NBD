<title>KSBNS 학회 어휘집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
  :root{
    --paper:#f4f7f8;
    --surface:#ffffff;
    --ink:#10181c;
    --ink-2:#46565e;
    --ink-3:#7b8b92;
    --line:#dbe4e7;
    --line-soft:#e9eff1;
    --accent:#0d6f79;
    --accent-soft:#e0eff0;
    --pop:#a8256f;
    --pop-soft:#f8e6f0;
    --mark:#bfe9ec;

    --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0c1317;
      --surface:#121d22;
      --ink:#e7f0f2;
      --ink-2:#a2b5bb;
      --ink-3:#73878e;
      --line:#213038;
      --line-soft:#1a262c;
      --accent:#4dcfd9;
      --accent-soft:#11313a;
      --pop:#f07ab5;
      --pop-soft:#331830;
      --mark:#1d4f57;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0c1317;
    --surface:#121d22;
    --ink:#e7f0f2;
    --ink-2:#a2b5bb;
    --ink-3:#73878e;
    --line:#213038;
    --line-soft:#1a262c;
    --accent:#4dcfd9;
    --accent-soft:#11313a;
    --pop:#f07ab5;
    --pop-soft:#331830;
    --mark:#1d4f57;
  }

  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--mark);color:var(--ink)}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

  .shell{
    display:grid;
    grid-template-columns:210px minmax(0,1fr);
    gap:0;
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- rail ---------- */
  .rail{
    border-right:1px solid var(--line);
    padding:34px 22px 60px 24px;
    position:sticky;
    top:0;
    align-self:start;
    max-height:100vh;
    overflow-y:auto;
  }
  .rail-mark{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:26px;
  }
  .rail-group{margin-bottom:22px}
  .rail-group h2{
    font-family:var(--mono);
    font-size:10px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-3);
    margin:0 0 8px;
  }
  .rail-group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .rail-group a{
    display:block;
    text-decoration:none;
    font-size:13px;
    color:var(--ink-2);
    padding:3px 0;
    border-left:2px solid transparent;
    padding-left:9px;
    margin-left:-11px;
    transition:color .12s,border-color .12s;
  }
  .rail-group a:hover{color:var(--ink)}
  .rail-group a.on{color:var(--accent);border-left-color:var(--accent)}
  .rail-group a.empty{opacity:.3}

  /* ---------- main ---------- */
  main{padding:0 0 96px;min-width:0}

  .masthead{
    padding:38px 34px 26px;
    display:flex;
    gap:28px;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--ink-3);
    margin:0 0 10px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:38px;
    line-height:1.1;
    letter-spacing:-.015em;
    margin:0 0 12px;
    text-wrap:balance;
  }
  .standfirst{
    margin:0;
    max-width:46ch;
    color:var(--ink-2);
    font-size:14.5px;
  }
  .trace{flex:0 0 auto}
  .trace figcaption{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-3);
    margin-top:6px;
    text-align:right;
  }

  /* ---------- controls ---------- */
  .controls{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:12px 34px;
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search{
    flex:1 1 260px;
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:3px;
    padding:0 11px;
    min-width:0;
  }
  .search:focus-within{border-color:var(--accent)}
  .search svg{flex:0 0 auto;color:var(--ink-3)}
  .search input{
    flex:1 1 auto;
    min-width:0;
    border:0;
    background:none;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    padding:8px 0;
  }
  .search input:focus{outline:none}
  .search input::placeholder{color:var(--ink-3)}
  .kbd{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-3);
    border:1px solid var(--line);
    border-radius:2px;
    padding:1px 5px;
  }
  .toggle{
    font-family:var(--sans);
    font-size:13px;
    color:var(--ink-2);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .toggle:hover{color:var(--ink)}
  .toggle[aria-pressed="true"]{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .count{
    font-family:var(--mono);
    font-size:11.5px;
    font-variant-numeric:tabular-nums;
    color:var(--ink-3);
    white-space:nowrap;
  }

  /* ---------- sections ---------- */
  .sec{padding:0 34px;scroll-margin-top:64px}
  .sec.hidden{display:none}
  .sec-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    padding:40px 0 14px;
  }
  .sec-head h3{
    font-family:var(--serif);
    font-size:21px;
    font-weight:600;
    margin:0;
    letter-spacing:-.01em;
  }
  .sec-head .en-name{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-3);
  }
  .sec-head .n{
    margin-left:auto;
    font-family:var(--mono);
    font-size:11px;
    font-variant-numeric:tabular-nums;
    color:var(--ink-3);
  }

  /* terms ledger */
  .terms{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:34px;
    border-top:1px solid var(--line);
  }
  .term{
    border-bottom:1px solid var(--line-soft);
    padding:9px 4px 9px 0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:1px;
  }
  .term.hidden{display:none}
  .term .en{
    font-family:var(--serif);
    font-size:15px;
    font-weight:500;
    line-height:1.35;
    color:var(--ink);
  }
  .term .ko{font-size:13.5px;color:var(--ink-2)}
  .term .note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-3);
    margin-top:2px;
    line-height:1.45;
  }

  /* phrases */
  .phrases{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
  .phrase{
    border-left:2px solid var(--accent-soft);
    padding:7px 0 7px 15px;
  }
  .phrase.hidden{display:none}
  .phrase:hover{border-left-color:var(--accent)}
  .phrase .en{
    font-family:var(--serif);
    font-size:15.5px;
    line-height:1.45;
    margin:0;
  }
  .phrase .ko{margin:1px 0 0;font-size:13px;color:var(--ink-2)}

  /* confusable pairs */
  .pairs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .pair{
    padding:11px 0 11px 15px;
    border-left:2px solid var(--pop-soft);
    border-bottom:1px solid var(--line-soft);
  }
  .pair.hidden{display:none}
  .pair .en{
    font-family:var(--serif);
    font-weight:600;
    font-size:15px;
    color:var(--pop);
  }
  .pair .ko{font-size:13.5px;color:var(--ink-2);margin-top:1px}

  mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}

  /* gloss hiding */
  .hide-gloss .term .ko,
  .hide-gloss .phrase .ko,
  .hide-gloss .pair .ko{
    opacity:0;
    transition:opacity .12s ease;
  }
  .hide-gloss .term:hover .ko,
  .hide-gloss .term:focus-within .ko,
  .hide-gloss .phrase:hover .ko,
  .hide-gloss .pair:hover .ko{opacity:1}

  .empty-state{
    padding:56px 0 20px;
    color:var(--ink-3);
    font-family:var(--mono);
    font-size:12.5px;
  }
  .empty-state.hidden{display:none}

  footer{
    margin:56px 34px 0;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.7;
    color:var(--ink-3);
  }

  @media (max-width:900px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .rail{display:none}
    .terms{grid-template-columns:minmax(0,1fr)}
    .masthead{padding:28px 20px 20px}
    h1{font-size:30px}
    .controls{padding:11px 20px}
    .sec{padding:0 20px}
    footer{margin:44px 20px 0}
    .trace{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>

<div class="shell">
  <aside class="rail">
    <div class="rail-mark">KSBNS</div>
    <nav id="rail"></nav>
  </aside>

  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">Korean Society for Brain and Neural Sciences</p>
        <h1>학회 영어 어휘집</h1>
        <p class="standfirst">발표를 듣고, 포스터 앞에서 질문하고, 논문을 쓰는 자리에서 실제로 오가는 표현만 골랐습니다. 영어 단어와 국문 대응어를 함께 실었고, 검색으로 바로 찾을 수 있습니다.</p>
      </div>
      <figure class="trace" aria-hidden="true">
        <svg width="252" height="72" viewBox="0 0 252 72" role="img">
          <line x1="6" y1="14" x2="246" y2="14" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity=".22"/>
          <line x1="6" y1="50" x2="246" y2="50" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity=".22"/>
          <path d="M6,50 L58,49 C68,48 70,16 78,14 C86,12 90,26 96,38 C100,46 103,59 110,58 C119,57 123,51 132,50 L246,50"
                fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          <text x="246" y="11" text-anchor="end" fill="currentColor" opacity=".5" style="font-family:var(--mono);font-size:9px">+40 mV</text>
          <text x="246" y="63" text-anchor="end" fill="currentColor" opacity=".5" style="font-family:var(--mono);font-size:9px">−70 mV</text>
          <line x1="150" y1="66" x2="176" y2="66" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
          <text x="180" y="69" fill="currentColor" opacity=".5" style="font-family:var(--mono);font-size:9px">2 ms</text>
        </svg>
        <figcaption>action potential · 활동전위</figcaption>
      </figure>
    </header>

    <div class="controls">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="영어·한국어로 검색 (예: patch, 가소성, LTP)" autocomplete="off" aria-label="어휘 검색">
        <span class="kbd">/</span>
      </label>
      <button class="toggle" id="glossBtn" type="button" aria-pressed="false">뜻 가리기</button>
      <span class="count" id="count"></span>
    </div>

    <div id="body"></div>
    <p class="empty-state hidden" id="empty">검색 결과가 없습니다.</p>

    <footer>
      KSBNS 학회 어휘집 · 학회 현장 · 연구 용어 · 연구자 생활 3부 구성<br>
      “뜻 가리기”를 켜면 국문 뜻이 감춰지고, 항목에 커서를 올리면 다시 보입니다 — 자가 점검용입니다.
    </footer>
  </main>
</div>

    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML =
      "<h3>" + esc(s.ko) + "</h3>" +
      "<span class='en-name'>" + esc(s.en) + "</span>" +
      "<span class='n'>" + s.items.length + "</span>";
    sec.appendChild(head);

    const list = document.createElement("div");
    list.className = s.kind === "terms" ? "terms" : (s.kind === "phrases" ? "phrases" : "pairs");

    const itemEls = [];
    s.items.forEach(it => {
      const el = document.createElement("div");
      el.className = s.kind === "terms" ? "term" : (s.kind === "phrases" ? "phrase" : "pair");
      el._en = it[0];
      el._ko = it[1] || "";
      el._note = it[2] || "";
      el._hay = (el._en + " " + el._ko + " " + el._note).toLowerCase();
      itemEls.push(el);
      list.appendChild(el);
      total++;
    });

    sec.appendChild(list);
    bodyEl.appendChild(sec);
    secEls.push({sec, head, link: a, itemEls, count: head.querySelector(".n")});
  });
});

function paint(el, re){
  const wrap = t => re ? esc(t).replace(re, m => "<mark>" + m + "</mark>") : esc(t);
  let html = "<div class='en'>" + wrap(el._en) + "</div>";
  if (el._ko) html += "<div class='ko'>" + wrap(el._ko) + "</div>";
  if (el._note) html += "<div class='note'>" + wrap(el._note) + "</div>";
  el.innerHTML = html;
}

function filter(raw){
  const q = raw.trim().toLowerCase();
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let shown = 0;

  secEls.forEach(({sec, link, itemEls, count}) => {
    let n = 0;
    itemEls.forEach(el => {
      const hit = !q || el._hay.includes(q);
      el.classList.toggle("hidden", !hit);
      if (hit){ paint(el, re); n++; }
    });
    count.textContent = n;
    sec.classList.toggle("hidden", n === 0);
    link.classList.toggle("empty", n === 0);
    shown += n;
  });

  emptyEl.classList.toggle("hidden", shown > 0);
  countEl.textContent = q ? shown + " / " + total + " 항목" : total + " 항목 · 16 분류";
}

filter("");
qEl.addEventListener("input", e => filter(e.target.value));

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl){
    e.preventDefault();
    qEl.focus();
    qEl.select();
  }
  if (e.key === "Escape" && document.activeElement === qEl){
    qEl.value = "";
    filter("");
    qEl.blur();
  }
});

const glossBtn = document.getElementById("glossBtn");
let hidden = false;
try { hidden = localStorage.getItem("ksbns-gloss") === "1"; } catch(err) {}
function applyGloss(){
  document.body.classList.toggle("hide-gloss", hidden);
  glossBtn.setAttribute("aria-pressed", String(hidden));
  glossBtn.textContent = hidden ? "뜻 보이기" : "뜻 가리기";
}
applyGloss();
glossBtn.addEventListener("click", () => {
  hidden = !hidden;
  applyGloss();
  try { localStorage.setItem("ksbns-gloss", hidden ? "1" : "0"); } catch(err) {}
});

// highlight the section currently in view
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const rec = secEls.find(s => s.sec === en.target);
    if (rec && en.isIntersecting){
      secEls.forEach(s => s.link.classList.remove("on"));
      rec.link.classList.add("on");
    }
  });
}, {rootMargin:"-15% 0px -75% 0px"});
secEls.forEach(s => obs.observe(s.sec));
</script>
